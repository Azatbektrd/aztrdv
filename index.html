<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbfbfa;--tx:#14181f;--mut:#6b7280;--line:#e7e7e3;--soft:#f1f1ee;--acc:#2442d6;--atx:#fff;--bad:#c0362c;--fld:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--tx:#f1f3f6;--mut:#939aa6;--line:#232832;--soft:#171b22;--acc:#8199ff;--atx:#0b1030;--bad:#ff8a80;--fld:#141820}}
:root[data-theme="dark"]{--bg:#0e1116;--tx:#f1f3f6;--mut:#939aa6;--line:#232832;--soft:#171b22;--acc:#8199ff;--atx:#0b1030;--bad:#ff8a80;--fld:#141820}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;padding:18px 22px 56px}
h1{font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:36px 0 8px}
h2{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin:28px 0 14px}
h3{font-size:15px;font-weight:600;color:var(--mut);margin:36px 0 4px}
p{margin:6px 0}
.mut{color:var(--mut);font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:3px}
.lang{font-size:15px;color:var(--mut);background:none;border:0;padding:10px 0 10px 10px;font-family:inherit;cursor:pointer}
.lang b{color:var(--tx)}
button,.btn{font:inherit;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;padding:10px 0;margin:0}
.lnk.bad{color:var(--bad)}
.lnk.back{color:var(--tx);padding-left:0}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--acc);color:var(--atx);padding:16px 20px;font-weight:650;text-align:center;margin-top:16px}
.btn.sm{display:inline-block;width:auto;padding:10px 20px;margin-top:10px;font-size:16px}
.btn.ghost{background:var(--soft);color:var(--tx)}
.btn:disabled{opacity:.5}
.act{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:24px 0;text-align:left;color:var(--tx)}
.act:last-of-type{border-bottom:1px solid var(--line)}
.act:active{background:var(--soft)}
.act b{display:block;font-size:26px;line-height:1.2;font-weight:650;letter-spacing:-.015em}
.act span{display:block;margin-top:4px;color:var(--mut);font-size:16px}
.it{border-top:1px solid var(--line);padding:18px 0}
.it:last-child{border-bottom:1px solid var(--line)}
.it b{font-size:19px;font-weight:650}
.it p{margin:2px 0 0}
label{display:block;margin-top:18px;font-size:15px;font-weight:600;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:6px;font:inherit;color:var(--tx);background:var(--fld);border:1.5px solid var(--line);border-radius:12px;padding:14px;appearance:none;-webkit-appearance:none}
textarea{min-height:104px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:flex;gap:6px;margin-top:20px}
.seg button{flex:1;background:var(--soft);color:var(--tx);border:0;border-radius:12px;padding:12px;font-weight:600}
.seg button.on{background:var(--acc);color:var(--atx)}
.tag{font-size:14px;color:var(--mut);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,12,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.pwa-banner{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;z-index:8;display:flex;align-items:center;gap:10px;padding:12px 8px 12px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line);box-shadow:0 8px 28px rgba(10,12,18,.18);font-size:16px;line-height:1.35}
.pwa-banner[hidden]{display:none}
.pwa-text{flex:1}
.pwa-go{border:0;border-radius:12px;background:var(--acc);color:var(--atx);padding:10px 16px;font-weight:650}
.pwa-go[hidden]{display:none}
.pwa-x{border:0;background:none;color:var(--mut);font-size:24px;line-height:1;width:40px;height:40px;border-radius:10px}
@media (prefers-reduced-motion:no-preference){.btn:active{transform:scale(.985)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var SB="https://grubygusixcalgumnusc.supabase.co/rest/v1/";
var KEY="sb_publishable_-Dlx30HixKWgx2JTYFNjvQ_TVZH2v1s";
var D=["Юнусабад","Чиланзар","Мирзо-Улугбек","Сергели","Яккасарай","Шайхантахур","Алмазар","Мирабад","Учтепа","Яшнабад","Бектемир"];
var T={
ru:{intro:"Одолжить вещь или попросить помощь у соседей рядом.",name:"Ваше имя",phone:"Ваш телефон",district:"Ваш район",start:"Начать",hi:"Здравствуйте",find:"Найти вещь",findS:"Дрель, стремянка, пылесос",help:"Нужна помощь",helpS:"Попросить соседей",garage:"Мой гараж",garageS:"Вещи, которыми делюсь",feed:"Просьбы соседей",back:"‹ Назад",add:"Добавить вещь",title:"Название",price:"Условия: цена или «бесплатно»",free:"бесплатно",del:"Удалить",search:"Название вещи",none:"Ничего не нашлось.",ask:"Попросить у соседей",call:"Позвонить",respond:"Откликнуться",mine:"Ваша просьба",reqph:"Например: нужен моющий пылесос на вечер",send:"Отправить просьбу",empty:"Пока пусто.",emptyG:"Добавьте первую вещь, и соседи её увидят.",ctitle:"Свяжитесь с соседом",close:"Закрыть",need:"Заполните имя и телефон",err:"Нет связи. Проверьте интернет и попробуйте ещё раз.",load:"Загрузка",exit:"Сменить профиль",all:"Все вещи в вашем районе",inst:"Установите «Сосед» на телефон, чтобы открывать в одно касание.",instIos:"В Safari нажмите «Поделиться», затем «На экран Домой».",instBtn:"Установить"},
uz:{intro:"Yaqin qo‘shnilardan buyum olish yoki yordam so‘rash.",name:"Ismingiz",phone:"Telefon raqamingiz",district:"Rayoningiz",start:"Boshlash",hi:"Assalomu alaykum",find:"Buyum topish",findS:"Parma, narvon, changyutgich",help:"Yordam kerak",helpS:"Qo‘shnilardan so‘rash",garage:"Mening garajim",garageS:"Ulashadigan buyumlarim",feed:"Qo‘shnilar so‘rovlari",back:"‹ Orqaga",add:"Buyum qo‘shish",title:"Nomi",price:"Shart: narx yoki «bepul»",free:"bepul",del:"O‘chirish",search:"Buyum nomi",none:"Hech narsa topilmadi.",ask:"Qo‘shnilardan so‘rash",call:"Qo‘ng‘iroq qilish",respond:"Javob berish",mine:"Sizning so‘rovingiz",reqph:"Masalan: kechqurunga yuvuvchi changyutgich kerak",send:"So‘rov yuborish",empty:"Hozircha bo‘sh.",emptyG:"Birinchi buyumni qo‘shing, qo‘shnilar ko‘radi.",ctitle:"Qo‘shni bilan bog‘laning",close:"Yopish",need:"Ism va telefonni kiriting",err:"Aloqa yo‘q. Internetni tekshirib, qayta urinib ko‘ring.",load:"Yuklanmoqda",exit:"Profilni almashtirish",all:"Rayoningizdagi barcha buyumlar",inst:"«Сосед»ni telefoningizga o‘rnating, bir bosishda ochiladi.",instIos:"Safari’da «Ulashish» tugmasini bosing, so‘ng «Bosh ekranga qo‘shish».",instBtn:"O‘rnatish"}
};
var S=load()||{lang:"ru",me:null};
var scr="home",draft="",FEED=[],tm=null;
function load(){try{return JSON.parse(localStorage.getItem("sosed_v2"))}catch(e){return null}}
function save(){try{localStorage.setItem("sosed_v2",JSON.stringify(S))}catch(e){}}
function t(k){return T[S.lang][k]}
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function enc(s){return encodeURIComponent(s)}
function tel(p){return String(p||"").replace(/[^\d+]/g,"")}
function api(path,opt){
opt=opt||{};opt.headers=Object.assign({apikey:KEY,"Content-Type":"application/json"},opt.headers||{});
return fetch(SB+path,opt).then(function(r){
if(!r.ok)throw new Error(r.status);
if(r.status===204)return null;
return r.text().then(function(x){return x?JSON.parse(x):null})})}
function go(s){scr=s;render();window.scrollTo(0,0)}
function setL(l){S.lang=l;save();render()}
function langBtn(){var r=S.lang=="ru";return '<button class="lang" onclick="setL(\''+(r?"uz":"ru")+'\')">'+(r?'<b>RU</b> / UZ':'RU / <b>UZ</b>')+'</button>'}
function shell(inner,back){return '<div class="top">'+(back?'<button class="lnk back" onclick="go(\'home\')">'+t("back")+'</button>':'<span class="logo">сосед<i></i></span>')+langBtn()+'</div>'+inner}
function errBox(el){el.innerHTML='<p class="mut" style="margin-top:16px">'+t("err")+'</p>'}
function loading(){return '<p class="mut" style="margin-top:16px">'+t("load")+'…</p>'}

function vOnboard(){
var r=S.lang=="ru";
return shell('<h1>'+t("intro")+'</h1>'+
'<div class="seg"><button class="'+(r?"on":"")+'" onclick="setL(\'ru\')">Русский</button><button class="'+(r?"":"on")+'" onclick="setL(\'uz\')">O‘zbekcha</button></div>'+
'<label>'+t("name")+'<input id="n" autocomplete="name"></label>'+
'<label>'+t("phone")+'<input id="p" type="tel" placeholder="+998 90 123 45 67"></label>'+
'<label>'+t("district")+'<select id="d">'+D.map(function(x){return '<option>'+h(x)+'</option>'}).join("")+'</select></label>'+
'<button class="btn" id="rb" onclick="reg()">'+t("start")+'</button><div id="em"></div>')}
function reg(){
var n=document.getElementById("n").value.trim(),p=document.getElementById("p").value.trim(),d=document.getElementById("d").value;
if(!n||!p){alert(t("need"));return}
document.getElementById("rb").disabled=true;
api("users",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({name:n,phone:p,district:d})})
.then(function(r){S.me={id:r[0].id,name:n,phone:p,district:d};save();go("home")})
.catch(function(){document.getElementById("rb").disabled=false;errBox(document.getElementById("em"))})}
function logout(){S.me=null;save();scr="home";render()}

function act(a,b,s){return '<button class="act" onclick="go(\''+s+'\')"><b>'+a+'</b><span>'+b+'</span></button>'}
function vHome(){
return shell('<h1>'+t("hi")+',<br>'+h(S.me.name)+'</h1><p class="mut" style="margin-bottom:28px">'+h(S.me.district)+'</p>'+
act(t("find"),t("findS"),"find")+act(t("help"),t("helpS"),"feed")+act(t("garage"),t("garageS"),"garage")+
'<p style="margin-top:28px"><button class="lnk" style="color:var(--mut);font-weight:500;font-size:16px" onclick="logout()">'+t("exit")+'</button></p>')}

function vGarage(){
return shell('<h2>'+t("garage")+'</h2><div id="list">'+loading()+'</div>'+
'<h3>'+t("add")+'</h3><label>'+t("title")+'<input id="it"></label><label>'+t("price")+'<input id="ip"></label><button class="btn" onclick="addItem()">'+t("add")+'</button>',1)}
function loadGarage(){
var el=document.getElementById("list");
api("items?select=id,title,price&user_id=eq."+S.me.id+"&order=created_at.desc").then(function(r){
el.innerHTML=r.length?r.map(function(i){return '<div class="it"><b>'+h(i.title)+'</b><p class="mut">'+h(i.price)+'</p><button class="lnk bad" onclick="delItem(\''+i.id+'\')">'+t("del")+'</button></div>'}).join(""):'<p class="mut">'+t("emptyG")+'</p>'
}).catch(function(){errBox(el)})}
function addItem(){
var a=document.getElementById("it").value.trim();if(!a)return;
api("items",{method:"POST",body:JSON.stringify({user_id:S.me.id,title:a,price:document.getElementById("ip").value.trim()||t("free"),district:S.me.district})})
.then(function(){render()}).catch(function(){errBox(document.getElementById("list"))})}
function delItem(id){api("items?id=eq."+id,{method:"DELETE"}).then(function(){render()}).catch(function(){errBox(document.getElementById("list"))})}

function vFind(){
return shell('<h2>'+t("find")+'</h2><input id="q" value="'+h(draft)+'" oninput="clearTimeout(tm);tm=setTimeout(doSearch,300)" placeholder="'+t("search")+'" aria-label="'+t("search")+'"><p class="mut" style="margin:10px 0 0">'+t("all")+'</p><div id="res"></div>',1)}
function doSearch(){
var el=document.getElementById("res");if(!el)return;
var q=document.getElementById("q").value.trim();draft=q;
var path="items?select=id,title,price,user_id,users(name,phone)&district=eq."+enc(S.me.district)+"&user_id=neq."+S.me.id+"&order=created_at.desc&limit=30"+(q?"&title=ilike."+enc("*"+q+"*"):"");
el.innerHTML=loading();
api(path).then(function(r){
if(document.getElementById("q").value.trim()!==q)return;
el.innerHTML=r.length?'<div style="margin-top:14px">'+r.map(function(i){var u=i.users||{};return '<div class="it"><b>'+h(i.title)+'</b><p class="mut">'+h(i.price)+' · '+h(u.name)+'</p><a class="btn sm" href="tel:'+h(tel(u.phone))+'">'+t("call")+'</a></div>'}).join("")+'</div>':
'<p class="mut" style="margin-top:16px">'+t("none")+'</p>'+(q?'<button class="btn ghost" onclick="go(\'feed\')">'+t("ask")+'</button>':'')
}).catch(function(){errBox(el)})}

function vFeed(){
return shell('<h2>'+t("help")+'</h2><textarea id="r" placeholder="'+t("reqph")+'" aria-label="'+t("help")+'">'+h(draft)+'</textarea><button class="btn" onclick="sendReq()">'+t("send")+'</button><h3>'+t("feed")+'</h3><div id="fl">'+loading()+'</div>',1)}
function loadFeed(){
var el=document.getElementById("fl");
api("requests?select=id,text,user_id,users(name,phone)&district=eq."+enc(S.me.district)+"&order=created_at.desc&limit=50").then(function(r){
FEED=r;
el.innerHTML=r.length?r.map(function(x,ix){var u=x.users||{},own=x.user_id===S.me.id;
return '<div class="it">'+(own?'<span class="tag">'+t("mine")+'</span>':'<b>'+h(u.name)+'</b>')+'<p>'+h(x.text)+'</p>'+
(own?'<button class="lnk bad" onclick="delReq(\''+x.id+'\')">'+t("del")+'</button>':'<button class="lnk" onclick="respond('+ix+')">'+t("respond")+'</button>')+'</div>'}).join(""):'<p class="mut">'+t("empty")+'</p>'
}).catch(function(){errBox(el)})}
function sendReq(){
var v=document.getElementById("r").value.trim();if(!v)return;
api("requests",{method:"POST",body:JSON.stringify({user_id:S.me.id,text:v,district:S.me.district})})
.then(function(){draft="";render()}).catch(function(){errBox(document.getElementById("fl"))})}
function delReq(id){api("requests?id=eq."+id,{method:"DELETE"}).then(function(){render()}).catch(function(){errBox(document.getElementById("fl"))})}
function respond(i){
var u=FEED[i].users||{},m=document.createElement("div");m.className="modal";m.onclick=function(e){if(e.target===m)m.remove()};
m.innerHTML='<div class="sheet"><h2>'+t("ctitle")+'</h2><p style="font-size:22px;font-weight:650;margin-bottom:4px">'+h(u.name)+'</p><a class="btn" href="tel:'+h(tel(u.phone))+'">'+t("call")+' '+h(u.phone)+'</a><button class="btn ghost" onclick="this.closest(\'.modal\').remove()">'+t("close")+'</button></div>';
document.body.appendChild(m)}

function render(){
var v=!S.me?vOnboard():scr=="garage"?vGarage():scr=="find"?vFind():scr=="feed"?vFeed():vHome();
document.getElementById("app").innerHTML=v;
document.documentElement.lang=S.lang=="uz"?"uz":"ru";
if(S.me){if(scr=="garage")loadGarage();else if(scr=="find")doSearch();else if(scr=="feed")loadFeed()}
if(window.pwaRefresh)pwaRefresh()}
render();
</script>
<script src="/js/pwa.js" defer></script>

  <!-- Кнопка включения уведомлений -->
<div style="text-align: center; margin: 20px;">
  <button onclick="subscribeToPush()" style="padding: 10px 20px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 5px;">Включить уведомления</button>
</div>

<!-- Скрипт подписки -->
<script>
async function subscribeToPush() {
  try {
    const registration = await navigator.serviceWorker.ready;
    const res = await fetch('/api/push/vapid-public-key');
    const { key } = await res.json();

    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: key
    });

    const response = await fetch('/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        subscription: subscription,
        userId: 'user_123'
      })
    });

    if (response.ok) {
      alert('Успешно! Уведомления включены.');
    } else {
      alert('Ошибка при сохранении подписки.');
    }
  } catch (err) {
    console.error(err);
    alert('Не удалось подписаться.');
  }
}
</script>
