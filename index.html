.then(function(r){S.me={id:r[0].id,name:n,phone:p,district:d,email:authTab=="email"?authId():""};save();authStep="start";authVal="";authProv="";authName="";go("home")})
.catch(function(){document.getElementById("rb").disabled=false;errBox(document.getElementById("em"))})}
/* ================= ВХОД (SMS / Email) ================= */
var authStep="start",authTab="phone",authVal="",authErr="",authBusy=false,tick=null,left=0,authProv="",authKey="",authName="";

/* ---- Отправка и проверка кода: Supabase Auth (настройка в Supabase -> Authentication) ---- */
var AUTH=SB.replace("rest/v1/","auth/v1/");
function authCall(path,body){
return fetch(AUTH+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)})}
function e164(){return "+998"+authVal.replace(/\D/g,"")}
function sendCode(kind,id){ /* kind: "phone" | "email" */
var body=kind=="phone"?{phone:e164(),create_user:true}:{email:id,create_user:true};
return authCall("otp",body).then(function(r){if(!r.ok)throw new Error(r.status)})}
function verifyCode(kind,id,code){ /* Promise<true|false> */
var body=kind=="phone"?{type:"sms",phone:e164(),token:code}:{type:"email",email:id,token:code};
return authCall("verify",body).then(function(r){
if(r.ok)return true;
if(r.status>=400&&r.status<500&&r.status!==429)return false; /* неверный или просроченный код */
throw new Error(r.status)})}
/* ------------------------------------------------------------------------------------- */

function authId(){if(authProv=="telegram")return authKey;return authTab=="phone"?"+998 "+authVal.trim():authVal.trim().toLowerCase()}
function authShow(){if(authProv=="telegram"){var u=authKey.split(":")[2];return "Telegram"+(u?" @"+u:authName?" "+authName:"")}return authId()}
function fmtPhone(v){var d=String(v).replace(/\D/g,"").slice(0,9),o=d.slice(0,2);if(d.length>2)o+=" "+d.slice(2,5);if(d.length>5)o+=" "+d.slice(5,7);if(d.length>7)o+=" "+d.slice(7,9);return o}
function onPh(el){el.value=fmtPhone(el.value);authVal=el.value}
function setTab(x){authTab=x;authVal="";authErr="";render()}
function authBack(){clearInterval(tick);authStep="start";authErr="";render()}
function showErr(m,mut){var e=document.getElementById("ae");if(e){e.textContent=m;e.style.color=mut?"var(--mut)":""}}

function vLogin(){
var ph=authTab=="phone";
return shell('<h1>'+t("loginT")+'</h1><p class="mut">'+t("loginS")+'</p>'+
'<div class="seg"><button class="'+(ph?"on":"")+'" onclick="setTab(\'phone\')">'+t("tabPhone")+'</button><button class="'+(ph?"":"on")+'" onclick="setTab(\'email\')">'+t("tabEmail")+'</button></div>'+
(ph?'<label>'+t("phoneL")+'<div class="pf"><span class="pre">+998</span><input id="v" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="90 123 45 67" value="'+h(authVal)+'" oninput="onPh(this)" onkeydown="if(event.key===\'Enter\')getCode()"></div></label>'
:'<label>'+t("emailL")+'<input id="v" type="email" autocomplete="email" placeholder="name@mail.com" value="'+h(authVal)+'" oninput="authVal=this.value" onkeydown="if(event.key===\'Enter\')getCode()"></label>')+
'<p class="err" id="ae">'+h(authErr)+'</p><button class="btn" id="gb" onclick="getCode()" style="margin-top:6px">'+t("getCode")+'</button>'+
'<div class="or">'+t("orSoc")+'</div>'+
'<button class="soc" id="gg" onclick="googleLogin()">'+IC.google+t("gLogin")+'</button>'+
'<button class="soc" id="tgb" onclick="tgLogin()">'+IC.tg+t("tgLogin")+'</button>')}

function getCode(){
var ph=authTab=="phone",v=authVal.trim();
var bad=ph?v.replace(/\D/g,"").length!==9:!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
if(bad){authErr=t(ph?"badPhone":"badEmail");showErr(authErr);return}
authErr="";showErr("");
var b=document.getElementById("gb");b.disabled=true;b.textContent=t("sending");
sendCode(authTab,authId()).then(function(){authStep="code";startTimer();render()})
.catch(function(){b.disabled=false;b.textContent=t("getCode");showErr(t("sendErr"))})}

function vCode(){
var ph=authTab=="phone",bx="";
for(var i=0;i<6;i++)bx+='<input class="ob" inputmode="numeric" autocomplete="'+(i?"off":"one-time-code")+'" aria-label="'+(i+1)+'/6" oninput="otpIn(this,'+i+')" onkeydown="otpKey(event,'+i+')" onpaste="otpPaste(event)">';
return shell('<h1>'+t("codeT")+'</h1><p class="mut">'+t(ph?"codeSentP":"codeSentE")+' <b style="color:var(--tx)">'+h(authId())+'</b> <button class="lnk" style="padding:0 0 0 6px" onclick="authBack()">'+t("changeId")+'</button></p>'+
'<div class="otp" id="otp">'+bx+'</div><p class="err" id="ae" style="text-align:center"></p>'+
'<p class="mut" style="text-align:center;margin-top:14px" id="rs"></p>',"auth")}

function boxes(){return document.querySelectorAll("#otp .ob")}
function otpFill(d,from){var b=boxes();for(var i=0;i<d.length&&from+i<6;i++)b[from+i].value=d[i];b[Math.min(from+d.length,5)].focus();checkOtp()}
function otpIn(el,i){var d=el.value.replace(/\D/g,"");if(d.length>1){el.value="";otpFill(d,i);return}el.value=d;if(d&&i<5)boxes()[i+1].focus();checkOtp()}
function otpKey(e,i){var b=boxes();if(e.key==="Backspace"&&!b[i].value&&i>0){b[i-1].value="";b[i-1].focus()}}
function otpPaste(e){var d=((e.clipboardData||window.clipboardData).getData("text")||"").replace(/\D/g,"").slice(0,6);if(!d)return;e.preventDefault();var b=boxes();for(var i=0;i<6;i++)b[i].value="";otpFill(d,0)}
function otpVal(){return Array.prototype.map.call(boxes(),function(x){return x.value}).join("")}
function clearOtp(){var b=boxes();for(var i=0;i<b.length;i++)b[i].value="";if(b[0])b[0].focus()}
function checkOtp(){var c=otpVal();if(c.length===6&&!authBusy)submitCode(c)}

function submitCode(c){
authBusy=true;showErr(t("checking"),1);
verifyCode(authTab,authId(),c).then(function(ok){
authBusy=false;
if(ok){clearInterval(tick);showErr("");afterAuth()}
else{showErr(t("badCode"));clearOtp()}
}).catch(function(){authBusy=false;showErr(t("err"))})}

function startTimer(){clearInterval(tick);left=60;tick=setInterval(function(){left--;if(left<=0){left=0;clearInterval(tick)}drawRs()},1000)}
function drawRs(){var el=document.getElementById("rs");if(!el)return;
el.innerHTML=left>0?t("resendIn")+' <b>0:'+(left<10?"0":"")+left+'</b>':'<button class="lnk" onclick="resendCode()">'+t("resend")+'</button>'}
function resendCode(){sendCode(authTab,authId()).then(function(){startTimer();drawRs();showErr("");clearOtp()}).catch(function(){showErr(t("sendErr"))})}

function afterAuth(){
var id=authId(),f=authProv=="telegram"?"like."+enc(id.split(":").slice(0,2).join(":")+":*"):"eq."+enc(id);
api("users?select=id,name,phone,district&phone="+f+"&limit=1").then(function(r){
if(r&&r[0]){S.me={id:r[0].id,name:r[0].name,phone:r[0].phone,district:r[0].district};save();authStep="start";authVal="";authProv="";authName="";scr="home";render()}
else toProfile()}).catch(function(){toProfile()})}
function toProfile(){authStep="profile";render()}

/* ================= ВЫХОД С ПОДТВЕРЖДЕНИЕМ ================= */
function askLogout(){
if(document.getElementById("lo"))return;
var m=document.createElement("div");m.id="lo";m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
m.onclick=function(e){if(e.target===m)closeLogout()};
m.innerHTML='<div class="sheet c"><div class="grab"></div><div class="lo-ic">'+IC.out+'</div><h2>'+t("outT")+'</h2><p class="mut" style="margin-bottom:8px">'+t("outS")+'</p><button class="btn red" onclick="confirmLogout()">'+t("outYes")+'</button><button class="btn ghost" id="lo-no" onclick="closeLogout()">'+t("outNo")+'</button></div>';
document.body.appendChild(m);document.body.style.overflow="hidden";
document.getElementById("lo-no").focus()}
function closeLogout(){var m=document.getElementById("lo");if(!m)return;m.removeAttribute("id");m.classList.add("out");document.body.style.overflow="";setTimeout(function(){m.remove()},220)}
function confirmLogout(){var m=document.getElementById("lo");if(m)m.remove();document.body.style.overflow="";logout()}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeLogout()});
function logout(){S.me=null;save();scr="home";authStep="start";authVal="";authErr="";authProv="";authName="";authKey="";authBusy=false;clearInterval(tick);render()}

function bento(ic,a,b,sc){return '<button class="bento" onclick="go(\''+sc+'\')"><span class="ico">'+IC[ic]+'</span><span><b>'+a+'</b><span class="s">'+b+'</span></span></button>'}
function vHome(){
return shell('<div class="grid">'+bento("search",t("find"),t("findS"),"find")+bento("hand",t("help"),t("helpS"),"feed")+bento("garage",t("garage"),t("garageS"),"garage")+bento("bell",t("notif"),t("notifS"),"notif")+'</div>'+
'<div class="foot"><button onclick="askLogout()">'+t("exit")+'</button></div>')}
function vNotif(){
return shell('<h2>'+t("notif")+'</h2><div class="empty"><span class="ico">'+IC.bell+'</span><p>'+t("notifEmpty")+'</p></div>',1)}

function vGarage(){
return shell('<h2>'+t("garage")+'</h2><div id="list">'+loading()+'</div>'+
'<h3>'+t("add")+'</h3><div class="card"><label>'+t("title")+'<input id="it"></label><label>'+t("price")+'<input id="ip"></label><button class="btn" onclick="addItem()">'+t("add")+'</button></div>',1)}
function loadGarage(){
var el=document.getElementById("list");
api("items?select=id,title,price&user_id=eq."+S.me.id+"&order=created_at.desc").then(function(r){
el.innerHTML=r.length?r.map(function(i){return '<div class="it"><b>'+h(i.title)+'</b><p class="mut">'+h(i.price)+'</p><button class="lnk bad" onclick="delItem(\''+i.id+'\')">'+t("del")+'</button></div>'}).join(""):'<div class="empty"><span class="ico">'+IC.garage+'</span><p>'+t("emptyG")+'</p></div>'
}).catch(function(){errBox(el)})}
function addItem(){
var a=document.getElementById("it").value.trim();if(!a)return;
api("items",{method:"POST",body:JSON.stringify({user_id:S.me.id,title:a,price:document.getElementById("ip").value.trim()||t("free"),district:S.me.district})})
.then(function(){render()}).catch(function(){errBox(document.getElementById("list"))})}
function delItem(id){api("items?id=eq."+id,{method:"DELETE"}).then(function(){render()}).catch(function(){errBox(document.getElementById("list"))})}

function vFind(){
return shell('<h2>'+t("find")+'</h2><input id="q" value="'+h(draft)+'" oninput="clearTimeout(tm);tm=setTimeout(doSearch,300)" placeholder="'+t("search")+'" aria-label="'+t("search")+'"><p class="mut" style="margin:10px 0 0">'+t("all")+'</p><div id="res"></div>',1)}
function doSearch(){
var el=document.getElementById("res");if(!el)return;
var q=document.getElementById("q").value.trim();draft=q;
var path="items?select=id,title,price,user_id,users(name,phone)&district=eq."+enc(S.me.district)+"&user_id=neq."+S.me.id+"&order=created_at.desc&limit=30"+(q?"&title=ilike."+enc("*"+q+"*"):"");
el.innerHTML=loading();
api(path).then(function(r){
if(document.getElementById("q").value.trim()!==q)return;
el.innerHTML=r.length?'<div style="margin-top:14px">'+r.map(function(i){var u=i.users||{};return '<div class="it"><b>'+h(i.title)+'</b><p class="mut">'+h(i.price)+' · '+h(u.name)+'</p>'+cbtn(u.phone,"btn sm",0)+'</div>'}).join("")+'</div>':
'<p class="mut" style="margin-top:16px">'+t("none")+'</p>'+(q?'<button class="btn ghost" onclick="go(\'feed\')">'+t("ask")+'</button>':'')
}).catch(function(){errBox(el)})}

function vFeed(){
return shell('<h2>'+t("help")+'</h2><textarea id="r" placeholder="'+t("reqph")+'" aria-label="'+t("help")+'">'+h(draft)+'</textarea><button class="btn" onclick="sendReq()">'+t("send")+'</button><h3>'+t("feed")+'</h3><div id="fl">'+loading()+'</div>',1)}
function loadFeed(){
var el=document.getElementById("fl");
api("requests?select=id,text,user_id,users(name,phone)&district=eq."+enc(S.me.district)+"&order=created_at.desc&limit=50").then(function(r){
FEED=r;
el.innerHTML=r.length?r.map(function(x,ix){var u=x.users||{},own=x.user_id===S.me.id;
return '<div class="it">'+(own?'<span class="tag">'+t("mine")+'</span>':'<b>'+h(u.name)+'</b>')+'<p>'+h(x.text)+'</p>'+
(own?'<button class="lnk bad" onclick="delReq(\''+x.id+'\')">'+t("del")+'</button>':'<button class="lnk" onclick="respond('+ix+')">'+t("respond")+'</button>')+'</div>'}).join(""):'<div class="empty"><span class="ico">'+IC.hand+'</span><p>'+t("empty")+'</p></div>'
}).catch(function(){errBox(el)})}
function sendReq(){
var v=document.getElementById("r").value.trim();if(!v)return;
api("requests",{method:"POST",body:JSON.stringify({user_id:S.me.id,text:v,district:S.me.district})})
.then(function(){draft="";render()}).catch(function(){errBox(document.getElementById("fl"))})}
function delReq(id){api("requests?id=eq."+id,{method:"DELETE"}).then(function(){render()}).catch(function(){errBox(document.getElementById("fl"))})}
function respond(i){
var u=FEED[i].users||{},m=document.createElement("div");m.className="modal";m.onclick=function(e){if(e.target===m)m.remove()};
m.innerHTML='<div class="sheet"><h2>'+t("ctitle")+'</h2><p style="font-size:22px;font-weight:650;margin-bottom:4px">'+h(u.name)+'</p>'+cbtn(u.phone,"btn",1)+'<button class="btn ghost" onclick="this.closest(\'.modal\').remove()">'+t("close")+'</button></div>';
document.body.appendChild(m)}

function render(){
var v=!S.me?(authStep=="profile"?vOnboard():authStep=="code"?vCode():vLogin()):scr=="garage"?vGarage():scr=="find"?vFind():scr=="feed"?vFeed():scr=="notif"?vNotif():vHome();
document.getElementById("app").innerHTML=v;
document.documentElement.lang=S.lang=="uz"?"uz":"ru";
if(!S.me&&authStep=="code"){drawRs();var f=document.querySelector("#otp .ob");if(f)f.focus()}
if(S.me){if(scr=="garage")loadGarage();else if(scr=="find")doSearch();else if(scr=="feed")loadFeed()}
if(window.pwaRefresh)pwaRefresh()}

/* ================= ВХОД ЧЕРЕЗ GOOGLE / TELEGRAM ================= */
var TG_BOT_ID="8869287860"; /* число из токена бота: 123456789:AAA... -> 123456789 */

function googleLogin(){
location.href=AUTH+"authorize?provider=google&prompt=select_account&redirect_to="+enc(location.origin+"/")}

function handleAuthReturn(){
var hs=location.hash;
if(hs.indexOf("access_token=")<0&&hs.indexOf("error")<0)return;
var q={};hs.slice(1).split("&").forEach(function(x){var i=x.indexOf("=");if(i>0)q[x.slice(0,i)]=decodeURIComponent(x.slice(i+1).replace(/\+/g," "))});
history.replaceState(null,"",location.pathname+location.search);
if(S.me)return;
if(!q.access_token){authErr=t("authFail");render();return}
fetch(AUTH+"user",{headers:{apikey:KEY,Authorization:"Bearer "+q.access_token}})
.then(function(r){if(!r.ok)throw 0;return r.json()})
.then(function(u){
if(!u.email)throw 0;
var m=u.user_metadata||{};
authProv="google";authTab="email";authVal=u.email;authName=m.full_name||m.name||"";
afterAuth()})
.catch(function(){authErr=t("authFail");render()})}

function loadTg(cb){
if(window.Telegram&&Telegram.Login)return cb();
var sc=document.createElement("script");sc.src="https://telegram.org/js/telegram-widget.js?22";
sc.onload=cb;sc.onerror=function(){showErr(t("err"))};
document.head.appendChild(sc)}
function tgLogin(){
if(TG_BOT_ID.indexOf("YOUR_")===0){showErr(t("tgOff"));return}
loadTg(function(){
Telegram.Login.auth({bot_id:TG_BOT_ID,request_access:"write"},function(u){
if(!u)return;
var nm=((u.first_name||"")+" "+(u.last_name||"")).trim();
authProv="telegram";authKey="tg:"+u.id+":"+(u.username||"");authName=nm;
afterAuth()})})}

render();
handleAuthReturn();
</script>
