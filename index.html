<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF7">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сосед">
<title>сосед</title>
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FDFBF7;--card:#fff;--tx:#1d1b18;--mut:#8b867d;--line:#ece8e0;--soft:#f5f2ea;--acc:#2442d6;--accs:#eef1fd;--atx:#fff;--bad:#c0362c;--fld:#fff;--sh:0 8px 24px rgba(60,50,30,.08)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;padding:16px 20px 48px;min-height:100vh}
h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:28px 0 8px}
h2{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:22px 0 14px}
h3{font-size:13px;font-weight:600;color:var(--mut);margin:28px 0 10px;text-transform:uppercase;letter-spacing:.06em}
p{margin:6px 0}
.mut{color:var(--mut);font-size:15px}
.top{display:flex;justify-content:space-between;align-items:flex-start;min-height:44px}
.logo{display:inline-block;font-weight:800;font-size:24px;line-height:1.1;letter-spacing:-.03em}
.logo i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:3px;vertical-align:2px}
.sub{margin-top:4px;font-size:12.5px;line-height:1.3;color:var(--mut)}
.lang{font-size:14px;color:var(--mut);background:none;border:0;padding:6px 0 6px 12px;font-family:inherit;cursor:pointer;letter-spacing:.02em}
.lang b{color:var(--tx);font-weight:700}
button,.btn{font:inherit;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;padding:8px 0;margin:0}
.lnk.bad{color:var(--bad)}
.back{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--tx);font-weight:600;font-size:14px;padding:8px 14px 8px 10px;margin:0}
.back svg{width:16px;height:16px}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--acc);color:var(--atx);padding:15px 20px;font-weight:650;text-align:center;margin-top:14px}
.btn.sm{display:inline-block;width:auto;padding:10px 20px;margin-top:10px;font-size:15px}
.btn.ghost{background:var(--soft);color:var(--tx)}
.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.bento{display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:172px;text-align:left;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;transition:box-shadow .2s,transform .2s,border-color .2s}
.bento:hover{box-shadow:var(--sh);border-color:#e2ddd2}
.bento:active{transform:scale(.98)}
.ico{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:var(--accs);color:var(--acc)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bento b{display:block;font-size:16px;line-height:1.2;font-weight:650;letter-spacing:-.01em;overflow-wrap:anywhere}
.bento span.s{display:block;margin-top:4px;color:var(--mut);font-size:12.5px;line-height:1.3}
.foot{margin-top:40px;text-align:center}
.foot button{background:none;border:0;color:var(--mut);font-size:15px;font-weight:500;padding:12px 20px;border-radius:999px}
.foot button:hover{background:var(--soft)}
.it,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px;transition:box-shadow .2s}
.it:hover,.card:hover{box-shadow:var(--sh)}
.it b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.it p{margin:2px 0 0}
.it .lnk{padding:6px 0 0}
.card label:first-child{margin-top:0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 16px;color:var(--mut)}
.empty .ico{width:56px;height:56px;border-radius:18px;background:var(--soft);color:var(--mut)}
.empty .ico svg{width:26px;height:26px}
label{display:block;margin-top:16px;font-size:13px;font-weight:600;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:6px;font:inherit;color:var(--tx);background:var(--fld);border:1px solid var(--line);border-radius:14px;padding:13px 14px;appearance:none;-webkit-appearance:none}
textarea{min-height:104px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:0;box-shadow:0 0 0 3px var(--accs)}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:flex;gap:4px;margin-top:20px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{flex:1;background:none;color:var(--mut);border:0;border-radius:10px;padding:10px;font-weight:600}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(60,50,30,.12)}
.tag{font-size:12px;color:var(--acc);background:var(--accs);border-radius:999px;padding:3px 10px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(20,16,10,.4);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.pwa-banner{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;z-index:8;display:flex;align-items:center;gap:10px;padding:12px 8px 12px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 28px rgba(60,50,30,.16);font-size:15px;line-height:1.35}
.pwa-banner[hidden]{display:none}
.pwa-text{flex:1}
.pwa-go{border:0;border-radius:12px;background:var(--acc);color:var(--atx);padding:10px 16px;font-weight:650}
.pwa-go[hidden]{display:none}
.pwa-x{border:0;background:none;color:var(--mut);font-size:24px;line-height:1;width:40px;height:40px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.bento,.it,.card{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var SB="https://grubygusixcalgumnusc.supabase.co/rest/v1/";
var KEY="sb_publishable_-Dlx30HixKWgx2JTYFNjvQ_TVZH2v1s";
var D=["Юнусабад","Чиланзар","Мирзо-Улугбек","Сергели","Яккасарай","Шайхантахур","Алмазар","Мирабад","Учтепа","Яшнабад","Бектемир"];
var T={
ru:{intro:"Одолжить вещь или попросить помощь у соседей рядом.",name:"Ваше имя",phone:"Ваш телефон",district:"Ваш район",start:"Начать",hi:"Здравствуйте",find:"Найти вещь",findS:"Дрель, стремянка, пылесос",help:"Нужна помощь",helpS:"Попросить соседей",garage:"Мой гараж",garageS:"Вещи, которыми делюсь",feed:"Просьбы соседей",back:"Назад",notif:"Уведомления",notifS:"Важные сообщения",notifEmpty:"Новых уведомлений пока нет.",add:"Добавить вещь",title:"Название",price:"Условия: цена или «бесплатно»",free:"бесплатно",del:"Удалить",search:"Название вещи",none:"Ничего не нашлось.",ask:"Попросить у соседей",call:"Позвонить",respond:"Откликнуться",mine:"Ваша просьба",reqph:"Например: нужен моющий пылесос на вечер",send:"Отправить просьбу",empty:"Пока пусто.",emptyG:"Добавьте первую вещь, и соседи её увидят.",ctitle:"Свяжитесь с соседом",close:"Закрыть",need:"Заполните имя и телефон",err:"Нет связи. Проверьте интернет и попробуйте ещё раз.",load:"Загрузка",exit:"Сменить профиль",all:"Все вещи в вашем районе",inst:"Установите «Сосед» на телефон, чтобы открывать в одно касание.",instIos:"В Safari нажмите «Поделиться», затем «На экран Домой».",instBtn:"Установить"},
uz:{intro:"Yaqin qo‘shnilardan buyum olish yoki yordam so‘rash.",name:"Ismingiz",phone:"Telefon raqamingiz",district:"Rayoningiz",start:"Boshlash",hi:"Assalomu alaykum",find:"Buyum topish",findS:"Parma, narvon, changyutgich",help:"Yordam kerak",helpS:"Qo‘shnilardan so‘rash",garage:"Mening garajim",garageS:"Ulashadigan buyumlarim",feed:"Qo‘shnilar so‘rovlari",back:"Orqaga",notif:"Bildirishnomalar",notifS:"Muhim xabarlar",notifEmpty:"Hozircha yangi xabarlar yo‘q.",add:"Buyum qo‘shish",title:"Nomi",price:"Shart: narx yoki «bepul»",free:"bepul",del:"O‘chirish",search:"Buyum nomi",none:"Hech narsa topilmadi.",ask:"Qo‘shnilardan so‘rash",call:"Qo‘ng‘iroq qilish",respond:"Javob berish",mine:"Sizning so‘rovingiz",reqph:"Masalan: kechqurunga yuvuvchi changyutgich kerak",send:"So‘rov yuborish",empty:"Hozircha bo‘sh.",emptyG:"Birinchi buyumni qo‘shing, qo‘shnilar ko‘radi.",ctitle:"Qo‘shni bilan bog‘laning",close:"Yopish",need:"Ism va telefonni kiriting",err:"Aloqa yo‘q. Internetni tekshirib, qayta urinib ko‘ring.",load:"Yuklanmoqda",exit:"Profilni almashtirish",all:"Rayoningizdagi barcha buyumlar",inst:"«Сосед»ni telefoningizga o‘rnating, bir bosishda ochiladi.",instIos:"Safari’da «Ulashish» tugmasini bosing, so‘ng «Bosh ekranga qo‘shish».",instBtn:"O‘rnatish"}
};
var S=load()||{lang:"uz",me:null};
var scr="home",draft="",FEED=[],tm=null;
function load(){try{return JSON.parse(localStorage.getItem("sosed_v2"))}catch(e){return null}}
function save(){try{localStorage.setItem("sosed_v2",JSON.stringify(S))}catch(e){}}
function t(k){return T[S.lang][k]}
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function enc(s){return encodeURIComponent(s)}
function tel(p){return String(p||"").replace(/[^\d+]/g,"")}
function api(path,opt){
opt=opt||{};opt.headers=Object.assign({apikey:KEY,"Content-Type":"application/json"},opt.headers||{});
return fetch(SB+path,opt).then(function(r){
if(!r.ok)throw new Error(r.status);
if(r.status===204)return null;
return r.text().then(function(x){return x?JSON.parse(x):null})})}
function go(s){scr=s;render();window.scrollTo(0,0)}
function setL(l){S.lang=l;save();render()}
function langBtn(){var r=S.lang=="ru";return '<button class="lang" onclick="setL(\''+(r?"uz":"ru")+'\')">'+(r?'<b>RU</b> / UZ':'RU / <b>UZ</b>')+'</button>'}
var IC={
search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
hand:'<svg viewBox="0 0 24 24"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>',
garage:'<svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-8h10v8"/><path d="M7 16.5h10"/></svg>',
bell:'<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>'};
function shell(inner,back){
var left=back?'<button class="back" onclick="go(\'home\')">'+IC.back+t("back")+'</button>':
'<div><span class="logo">сосед<i></i></span>'+(S.me?'<div class="sub">'+h(S.me.name)+' • '+h(S.me.district)+'</div>':'')+'</div>';
return '<div class="top">'+left+langBtn()+'</div>'+inner}
function errBox(el){el.innerHTML='<p class="mut" style="margin-top:16px">'+t("err")+'</p>'}
function loading(){return '<p class="mut" style="margin-top:16px">'+t("load")+'…</p>'}

function vOnboard(){
var r=S.lang=="ru";
return shell('<h1>'+t("intro")+'</h1>'+
'<div class="seg"><button class="'+(r?"on":"")+'" onclick="setL(\'ru\')">Русский</button><button class="'+(r?"":"on")+'" onclick="setL(\'uz\')">O‘zbekcha</button></div>'+
'<label>'+t("name")+'<input id="n" autocomplete="name"></label>'+
'<label>'+t("phone")+'<input id="p" type="tel" placeholder="+998 90 123 45 67"></label>'+
'<label>'+t("district")+'<select id="d">'+D.map(function(x){return '<option>'+h(x)+'</option>'}).join("")+'</select></label>'+
'<button class="btn" id="rb" onclick="reg()">'+t("start")+'</button><div id="em"></div>')}
function reg(){
var n=document.getElementById("n").value.trim(),p=document.getElementById("p").value.trim(),d=document.getElementById("d").value;
if(!n||!p){alert(t("need"));return}
document.getElementById("rb").disabled=true;
api("users",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({name:n,phone:p,district:d})})
.then(function(r){S.me={id:r[0].id,name:n,phone:p,district:d};save();go("home")})
.catch(function(){document.getElementById("rb").disabled=false;errBox(document.getElementById("em"))})}
function logout(){S.me=null;save();scr="home";render()}

function bento(ic,a,b,sc){return '<button class="bento" onclick="go(\''+sc+'\')"><span class="ico">'+IC[ic]+'</span><span><b>'+a+'</b><span class="s">'+b+'</span></span></button>'}
function vHome(){
return shell('<div class="grid">'+bento("search",t("find"),t("findS"),"find")+bento("hand",t("help"),t("helpS"),"feed")+bento("garage",t("garage"),t("garageS"),"garage")+bento("bell",t("notif"),t("notifS"),"notif")+'</div>'+
'<div class="foot"><button onclick="logout()">'+t("exit")+'</button></div>')}
function vNotif(){
return shell('<h2>'+t("notif")+'</h2><div class="empty"><span class="ico">'+IC.bell+'</span><p>'+t("notifEmpty")+'</p></div>',1)}

function vGarage(){
return shell('<h2>'+t("garage")+'</h2><div id="list">'+loading()+'</div>'+
'<h3>'+t("add")+'</h3><div class="card"><label>'+t("title")+'<input id="it"></label><label>'+t("price")+'<input id="ip"></label><button class="btn" onclick="addItem()">'+t("add")+'</button></div>',1)}
function loadGarage(){
var el=document.getElementById("list");
api("items?select=id,title,price&user_id=eq."+S.me.id+"&order=created_at.desc").then(function(r){
el.innerHTML=r.length?r.map(function(i){return '<div class="it"><b>'+h(i.title)+'</b><p class="mut">'+h(i.price)+'</p><button class="lnk bad" onclick="delItem(\''+i.id+'\')">'+t("del")+'</button></div>'}).join(""):'<div class="empty"><span class="ico">'+IC.garage+'</span><p>'+t("emptyG")+'</p></div>'
}).catch(function(){errBox(el)})}
function addItem(){
var a=document.getElementById("it").value.trim();if(!a)return;
api("items",{method:"POST",body:JSON.stringify({user_id:S.me.id,title:a,price:document.getElementById("ip").value.trim()||t("free"),district:S.me.district})})
.then(function(){render()}).catch(function(){errBox(document.getElementById("list"))})}
function delItem(id){api("items?id=eq."+id,{method:"DELETE"}).then(function(){render()}).catch(function(){errBox(document.getElementById("list"))})}

function vFind(){
return shell('<h2>'+t("find")+'</h2><input id="q" value="'+h(draft)+'" oninput="clearTimeout(tm);tm=setTimeout(doSearch,300)" placeholder="'+t("search")+'" aria-label="'+t("search")+'"><p class="mut" style="margin:10px 0 0">'+t("all")+'</p><div id="res"></div>',1)}
function doSearch(){
var el=document.getElementById("res");if(!el)return;
var q=document.getElementById("q").value.trim();draft=q;
var path="items?select=id,title,price,user_id,users(name,phone)&district=eq."+enc(S.me.district)+"&user_id=neq."+S.me.id+"&order=created_at.desc&limit=30"+(q?"&title=ilike."+enc("*"+q+"*"):"");
el.innerHTML=loading();
api(path).then(function(r){
if(document.getElementById("q").value.trim()!==q)return;
el.innerHTML=r.length?'<div style="margin-top:14px">'+r.map(function(i){var u=i.users||{};return '<div class="it"><b>'+h(i.title)+'</b><p class="mut">'+h(i.price)+' · '+h(u.name)+'</p><a class="btn sm" href="tel:'+h(tel(u.phone))+'">'+t("call")+'</a></div>'}).join("")+'</div>':
'<p class="mut" style="margin-top:16px">'+t("none")+'</p>'+(q?'<button class="btn ghost" onclick="go(\'feed\')">'+t("ask")+'</button>':'')
}).catch(function(){errBox(el)})}

function vFeed(){
return shell('<h2>'+t("help")+'</h2><textarea id="r" placeholder="'+t("reqph")+'" aria-label="'+t("help")+'">'+h(draft)+'</textarea><button class="btn" onclick="sendReq()">'+t("send")+'</button><h3>'+t("feed")+'</h3><div id="fl">'+loading()+'</div>',1)}
function loadFeed(){
var el=document.getElementById("fl");
api("requests?select=id,text,user_id,users(name,phone)&district=eq."+enc(S.me.district)+"&order=created_at.desc&limit=50").then(function(r){
FEED=r;
el.innerHTML=r.length?r.map(function(x,ix){var u=x.users||{},own=x.user_id===S.me.id;
return '<div class="it">'+(own?'<span class="tag">'+t("mine")+'</span>':'<b>'+h(u.name)+'</b>')+'<p>'+h(x.text)+'</p>'+
(own?'<button class="lnk bad" onclick="delReq(\''+x.id+'\')">'+t("del")+'</button>':'<button class="lnk" onclick="respond('+ix+')">'+t("respond")+'</button>')+'</div>'}).join(""):'<div class="empty"><span class="ico">'+IC.hand+'</span><p>'+t("empty")+'</p></div>'
}).catch(function(){errBox(el)})}
function sendReq(){
var v=document.getElementById("r").value.trim();if(!v)return;
api("requests",{method:"POST",body:JSON.stringify({user_id:S.me.id,text:v,district:S.me.district})})
.then(function(){draft="";render()}).catch(function(){errBox(document.getElementById("fl"))})}
function delReq(id){api("requests?id=eq."+id,{method:"DELETE"}).then(function(){render()}).catch(function(){errBox(document.getElementById("fl"))})}
function respond(i){
var u=FEED[i].users||{},m=document.createElement("div");m.className="modal";m.onclick=function(e){if(e.target===m)m.remove()};
m.innerHTML='<div class="sheet"><h2>'+t("ctitle")+'</h2><p style="font-size:22px;font-weight:650;margin-bottom:4px">'+h(u.name)+'</p><a class="btn" href="tel:'+h(tel(u.phone))+'">'+t("call")+' '+h(u.phone)+'</a><button class="btn ghost" onclick="this.closest(\'.modal\').remove()">'+t("close")+'</button></div>';
document.body.appendChild(m)}

function render(){
var v=!S.me?vOnboard():scr=="garage"?vGarage():scr=="find"?vFind():scr=="feed"?vFeed():scr=="notif"?vNotif():vHome();
document.getElementById("app").innerHTML=v;
document.documentElement.lang=S.lang=="uz"?"uz":"ru";
if(S.me){if(scr=="garage")loadGarage();else if(scr=="find")doSearch();else if(scr=="feed")loadFeed()}
if(window.pwaRefresh)pwaRefresh()}
render();
</script>
<script src="/js/pwa.js" defer></script>
</body>
</html>
