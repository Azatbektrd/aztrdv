<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbfa">
  <title>Нет сети — Сосед</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fbfbfa; color: #1a1a1a;
    }
    main { max-width: 320px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 20px; line-height: 1.5; color: #555; }
    button {
      font: inherit; font-weight: 600; padding: 12px 22px;
      border: 0; border-radius: 12px; background: #1a1a1a; color: #fbfbfa;
    }
    button:focus-visible { outline: 3px solid #888; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      body { background: #141414; color: #f2f2f0; }
      p { color: #aaa; }
      button { background: #f2f2f0; color: #141414; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Нет подключения</h1>
    <p>Проверь интернет и попробуй ещё раз. Как только сеть появится, вещи загрузятся.</p>
    <button onclick="location.reload()">Обновить</button>
  </main>
</body>
</html>
